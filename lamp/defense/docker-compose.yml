version: "2.2"

services:
  latex:
    image: faust.cs.fau.de:5000/lamp
    restart: unless-stopped
    command:
      - "socat"
      - "-6"
      - "tcp-l:1337,fork,reuseaddr,max-children=1,backlog=256"
      - "EXEC:/srv/entrypoint.sh"
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 128
    ports:
      - 1337:1337
    volumes:
      - ./srv:/srv:ro
      - storage:/storage
  cleanup:
    image: faust.cs.fau.de:5000/lamp
    entrypoint: /cleanup.sh
    volumes:
      - ./srv:/srv:ro
      - storage:/storage
  redis:
    image: redis
  mariadb:
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lamp
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db:/var/lib/mysql

volumes:
    storage:
    db:

networks:
  default:
    enable_ipv6: true
    ipam:
        driver: default
        config:
            - subnet: "fd42:d0ce:7777::/64"